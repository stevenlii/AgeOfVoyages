# =============================================================================
# 部署配置文件（deploy.properties）
# -----------------------------------------------------------------------------
# 用途：声明“部署包内的文件”与“离线机实际文件”的对应关系。
#       deploy.sh start 启动时，会按本文件的配置，把【离线机实际文件】
#       复制到【部署包内对应位置】，完成配置 / 密钥的自动替换。
#
# 规则（成对出现，key 可任意命名，但 .current 与 .runtime 必须成对）：
#   <key>.current = 部署包内的相对路径（相对于 deploy/ 根目录）
#                   例如：config/env.yml 或 config/age-of-voyages.yml
#   <key>.runtime = 离线机上的实际路径（绝对路径，或以 ~/ 开头的家目录路径）
#                   例如：~/age-of-voyages/env.yml
#
# 启动时处理逻辑：
#   1) 读取本文件中每一对 <key>.current 与 <key>.runtime；
#   2) 若 <key>.runtime 指向的文件存在，则 cp 覆盖到 <key>.current 的位置；
#   3) 若文件不存在，仅打印警告（不阻断启动），部署包保持原有默认配置。
#
# 好处：仓库与 deploy.tar.gz 都无需携带真实密钥；真实文件只存在于离线机本地。
# =============================================================================

# config/env.yml 文件：密钥等配置（YAML 格式，current 为包内相对路径，runtime 为离线机真实文件）。
# 注意：该文件【不随 deploy.tar.gz 打包】，离线机部署时由 env.runtime 指向的真实文件复制生成。
#       各服务启动时通过 --spring.config.additional-location=optional:file:config/env.yml 加载它，
#       用与代码一致的键（如 DB_PASSWORD）覆盖默认配置，无需改代码。
#       若离线机不提供此文件，各服务会使用 config/age-of-voyages.yml 中的默认值正常启动。
env.current=config/env.yml
env.runtime=~/Documents/age-of-voyages-config/env.yml

# age-of-voyages.yml 配置文件
#age-of-voyages.yml.current=config/age-of-voyages.yml
#age-of-voyages.yml.runtime=~/Documents/age-of-voyages-config/age-of-voyages.yml
