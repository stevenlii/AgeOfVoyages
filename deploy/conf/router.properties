# =============================================================================
# 服务路由配置（router.properties）
# -----------------------------------------------------------------------------
# 本服务（age-of-voyages）为单一后端服务，前端与后端同源部署，
# 无需走反向代理分发，因此本文件当前仅保留占位，供后续扩展多服务时使用。
#
# 约定（若后续拆分为多后端服务）：
#   前端调用任意后端功能都走 /api/{service}/...，本文件里写一行
#   {service}.base = http://host:port，后端启动时就会把该前缀转发到对应服务。
# =============================================================================

# 本服务自身（age-of-voyages，:8080）
api.base=http://127.0.0.1:8080
